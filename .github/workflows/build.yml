name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      archs:
        description: 'React Native ABIs (comma separated, e.g. arm64-v8a)'
        required: false
        default: 'arm64-v8a'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        env:
          # Single ABI keeps the APK well under the size that times out on store uploads.
          # Override per run from the Actions tab (workflow_dispatch) if a fat build is needed.
          ARCHS: ${{ inputs.archs || 'arm64-v8a' }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures="$ARCHS" --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/RakaatCounter-release.apk
          ls -lh artifacts

      - name: Report APK facts
        run: |
          APK=artifacts/RakaatCounter-release.apk
          unzip -l "$APK" | grep -o 'lib/[^/]*/' | sort -u
          echo "size: $(stat -c %s "$APK") bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RakaatCounter-release-apk
          path: artifacts/RakaatCounter-release.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RakaatCounter ${{ github.ref_name }}
          files: artifacts/RakaatCounter-release.apk
          generate_release_notes: true
